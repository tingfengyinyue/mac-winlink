name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-client:
    name: macOS client tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check Bash syntax
        run: /bin/bash -n bin/winlink install-mac.sh
      - name: Run isolated client tests
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check

  windows-syntax:
    name: Windows PowerShell 5.1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse PowerShell scripts without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem windows,examples -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            } else {
              Write-Host "Parsed: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
